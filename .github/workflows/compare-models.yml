name: AI code review - compare models

# Runs the same Go review agent (marianina8/pr-review-agent) on the same code with several
# models in parallel: same tools, same guidelines, same step limit; only the model changes.
# Each model's review is its own artifact (code-review-<label>) and its own section on the
# run's summary page, with steps, tool calls, tokens and time.
on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: "Max model calls per model"
        default: "20"
      include_opus:
        description: "Also run Claude Opus 5.5 (costs more)"
        type: boolean
        default: false
      target:
        description: "File or folder to review"
        default: "."
      qwen_model:
        description: "Qwen3-Coder 480B (Bedrock)"
        default: "qwen.qwen3-coder-480b-a35b-v1:0"
      deepseek_model:
        description: "DeepSeek V3.2 (Bedrock)"
        default: "deepseek.v3.2"
      sonnet_model:
        description: "Claude Sonnet 5.5 (Anthropic API: Bedrock refuses Claude 5.x on this account)"
        default: "claude-sonnet-5-5"
      haiku_model:
        description: "Claude Haiku 4.5 (Bedrock)"
        default: "us.anthropic.claude-haiku-4-5-20251001-v1:0"

permissions:
  contents: read
  pull-requests: write
  id-token: write   # sign in to AWS without stored keys

concurrency:
  group: compare-models
  cancel-in-progress: false

jobs:
  review:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false   # one model failing shouldn't cancel the others
      matrix:
        include:
          - { label: qwen3-coder-480b, provider: bedrock, model: "${{ inputs.qwen_model }}" }
          - { label: deepseek-v3-2, provider: bedrock, model: "${{ inputs.deepseek_model }}" }
          - { label: claude-sonnet-5-5, provider: anthropic, model: "${{ inputs.sonnet_model }}" }
          - { label: claude-haiku-4-5, provider: bedrock, model: "${{ inputs.haiku_model }}" }
    uses: marianina8/pr-review-agent/.github/workflows/code-review.yml@main
    with:
      mode: code
      target: ${{ inputs.target }}
      provider: ${{ matrix.provider }}
      model: ${{ matrix.model }}
      max_steps: ${{ fromJSON(inputs.max_steps) }}
      label: ${{ matrix.label }}-go-agent
      aws_role_arn: ${{ vars.BEDROCK_REVIEW_ROLE_ARN }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  opus:
    name: claude-opus-5-5
    if: ${{ inputs.include_opus }}
    uses: marianina8/pr-review-agent/.github/workflows/code-review.yml@main
    with:
      mode: code
      target: ${{ inputs.target }}
      provider: anthropic
      model: claude-opus-5-5
      max_steps: ${{ fromJSON(inputs.max_steps) }}
      label: claude-opus-5-5-go-agent
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

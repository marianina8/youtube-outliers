name: Ollama review

on:
  # Review what a pull request changes and comment on it.
  pull_request:
    paths: ["**.go", "go.mod", "go.sum"]
  # "Run workflow" button on the Actions tab: review the whole codebase (or one folder).
  workflow_dispatch:
    inputs:
      target:
        description: "File or folder to review"
        default: "."
      model:
        description: "Ollama model"
        default: "qwen2.5-coder:7b"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ollama-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    uses: marianina8/pr-review-agent/.github/workflows/ollama-review.yml@main
    with:
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'code' }}
      target: ${{ inputs.target || '.' }}
      model: ${{ inputs.model || 'qwen2.5-coder:7b' }}

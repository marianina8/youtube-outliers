name: AI code review

# Runs the Go review agent from marianina8/pr-review-agent on this repo.
on:
  # Review what a pull request changes and comment on it.
  pull_request:
    paths: ["**.go", "go.mod", "go.sum"]
  # "Run workflow" button on the Actions tab: review the whole codebase (or one folder).
  workflow_dispatch:
    inputs:
      provider:
        description: "Which model API the agent uses"
        type: choice
        options: [anthropic, bedrock, ollama]
        default: anthropic
      model:
        description: "Model (empty = claude-sonnet-5-5 / qwen.qwen3-coder-480b-a35b-v1:0 / qwen2.5-coder:7b)"
        default: ""
      target:
        description: "File or folder to review"
        default: "."

permissions:
  contents: read
  pull-requests: write
  id-token: write   # lets provider=bedrock sign in to AWS without stored keys

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    uses: marianina8/pr-review-agent/.github/workflows/code-review.yml@main
    with:
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'code' }}
      target: ${{ inputs.target || '.' }}
      provider: ${{ inputs.provider || vars.REVIEW_PROVIDER || 'anthropic' }}
      model: ${{ inputs.model || '' }}
      aws_role_arn: ${{ vars.BEDROCK_REVIEW_ROLE_ARN }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
